[project]
name = "collaborative-oscal-oscal"
version = "0.1.0"
description = "OSCAL artifact boundary for Collaborative OSCAL"
requires-python = ">=3.12,<3.14"
dependencies = [
    "compliance-trestle>=5.2,<5.3",
    "PyYAML>=6,<7",
    "pydantic>=2.12,<3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
