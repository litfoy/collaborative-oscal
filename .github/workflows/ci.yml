name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run pytest -m "not integration"
        working-directory: apps/api

  api-integration:
    runs-on: ubuntu-latest
    env:
      # CI-only credentials for a disposable service database; never reuse elsewhere.
      # Existing (transitional) integration tests use the owner credential; separate-role tests
      # use the owner, runtime and provisioner credentials (ADR 0029 §8, milestone 29.1a).
      TEST_DATABASE_URL: postgresql+psycopg://oscal_owner:ci-only-owner-password@localhost:5432/collaborative_oscal_test
      TEST_DATABASE_OWNER_URL: postgresql+psycopg://oscal_owner:ci-only-owner-password@localhost:5432/collaborative_oscal_test
      TEST_DATABASE_RUNTIME_URL: postgresql+psycopg://oscal_runtime:ci-only-runtime-password@localhost:5432/collaborative_oscal_test
      TEST_DATABASE_PROVISIONER_URL: postgresql+psycopg://oscal_provisioner:ci-only-provisioner-password@localhost:5432/collaborative_oscal_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: collaborative_oscal_test
          POSTGRES_USER: collaborative_oscal
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collaborative_oscal -d collaborative_oscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: apps/api
      - name: Bootstrap database roles (cluster-level, superuser)
        run: uv run python -m app.persistence.database_roles bootstrap-roles
        working-directory: apps/api
        env:
          DATABASE_ADMIN_URL: postgresql+psycopg://collaborative_oscal:ci-only-password@localhost:5432/collaborative_oscal_test
          OSCAL_OWNER_DB_PASSWORD: ci-only-owner-password
          OSCAL_RUNTIME_DB_PASSWORD: ci-only-runtime-password
          OSCAL_PROVISIONER_DB_PASSWORD: ci-only-provisioner-password
      - run: uv run pytest -m integration --require-database-roles
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run lint
      - run: npm --workspace apps/web run typecheck
      - run: npm --workspace apps/web run test

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
      - run: chmod +x scripts/generate_sboms.sh
      - run: scripts/generate_sboms.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/sbom/
          if-no-files-found: error