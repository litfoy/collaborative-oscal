name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run pytest -m "not integration"
        working-directory: apps/api

  api-integration:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://collaborative_oscal:ci-only-password@localhost:5432/collaborative_oscal_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: collaborative_oscal_test
          POSTGRES_USER: collaborative_oscal
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collaborative_oscal -d collaborative_oscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run pytest -m integration
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run lint
      - run: npm --workspace apps/web run typecheck
      - run: npm --workspace apps/web run test

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
      - run: chmod +x scripts/generate_sboms.sh
      - run: scripts/generate_sboms.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/sbom/
          if-no-files-found: error