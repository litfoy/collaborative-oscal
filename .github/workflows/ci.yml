name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://collaborative_oscal:ci-only-password@localhost:5432/collaborative_oscal_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: collaborative_oscal_test
          POSTGRES_USER: collaborative_oscal
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collaborative_oscal -d collaborative_oscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run pytest
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run lint
      - run: npm --workspace apps/web run typecheck
