[project]
name = "collaborative-oscal-api"
version = "0.1.0"
description = "FastAPI foundation for Collaborative OSCAL"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "pydantic-settings>=2.16,<3",
    "uvicorn[standard]>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
