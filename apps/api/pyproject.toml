[project]
name = "collaborative-oscal-api"
version = "0.1.0"
description = "FastAPI foundation for Collaborative OSCAL"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "collaborative-oscal-oscal",
    "fastapi>=0.163.2,<1",
    "PyJWT[crypto]>=2.10,<3",
    "psycopg[binary]>=3.3.9,<4",
    "pydantic-settings>=2.16.3,<3",
    "sqlalchemy>=2.1.9,<3",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2,<3",
    "pytest>=9.2,<10",
    "ruff>=0.17.5,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: tests requiring a dedicated PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
collaborative-oscal-oscal = { path = "../../packages/oscal", editable = true }
